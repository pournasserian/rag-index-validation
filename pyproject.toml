[project]
name = "rag-index-validation"
version = "0.1.0"
description = "Checks for a vector database built for RAG: the corpus and its chunks, the embeddings and the HNSW index, retrieval against a golden question set, and the answer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Amir Pournasserian" }]
dependencies = [
    "openai>=1.60",
    "chromadb>=1.0",
    "tiktoken>=0.9",
    "ranx>=0.3.20",
    "datasketch>=1.6",
    "numpy>=1.26",
]

[tool.uv]
package = false
